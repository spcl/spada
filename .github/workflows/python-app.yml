# This workflow will install Python dependencies and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-pytest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi

    - name: Test with pytest
      run: |
        PYTHONPATH=`pwd` pytest

  # WSE-2 and WSE-3 share one runner so Singularity and the SDK are installed
  # once.
  test-csl:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi

    - name: Install CSL dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euxo pipefail
        . /etc/os-release
        echo "Using Ubuntu version $UBUNTU_CODENAME"

        # Avoid man-db postinst work during package installs.
        echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null

        sudo apt-get update -y -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends \
          build-essential libssl-dev uuid-dev libgpgme11-dev squashfs-tools

        wget -q -O singularity.deb \
          "https://github.com/sylabs/singularity/releases/download/v4.2.1/singularity-ce_4.2.1-${UBUNTU_CODENAME}_amd64.deb"
        # Must pass -y: bare "apt install ./singularity.deb" waits for confirmation and hangs CI.
        sudo apt-get install -y --no-install-recommends ./singularity.deb
        singularity --version

    - name: Cache Cerebras SDK
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: cerebras-sdk
        key: ${{ runner.os }}-cerebras-sdk-1.4.0

    - name: Install Cerebras SDK v1.4.0
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        mkdir cerebras-sdk
        cd cerebras-sdk
        wget -q -O sdk-1.4.0.tar.gz "${{ secrets.CSL_SDK_URL }}"
        tar xf sdk-1.4.0.tar.gz
        rm sdk-1.4.0.tar.gz
        cd ..

    - name: Test Cerebras SDK
      run: |
        ./cerebras-sdk/cslc -h

    - name: Test CSL with simulator
      run: |
        pip install --no-deps -e .
        export PATH=$PATH:`pwd`/cerebras-sdk
        status=0
        for arch in wse2 wse3; do
          echo "::group::WSE_ARCH=$arch"
          if WSE_ARCH=$arch ./tests/csl_runtime/run_tests.sh; then
            echo "$arch passed"
          else
            echo "$arch failed"
            status=1
          fi
          echo "::endgroup::"
        done
        exit $status
